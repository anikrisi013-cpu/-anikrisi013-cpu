<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anik Roy — Graphic Designer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    :root {
      --bg: #050910;
      --card: #0b1422;
      --card2: #101c2e;
      --text: #f5f7fb;
      --muted: #9aa8bb;
      --blue: #1683ff;
      --blue2: #0066ff;
      --border: rgba(255,255,255,.09);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 80% 10%, rgba(0,110,255,.13), transparent 28%),
        radial-gradient(circle at 20% 60%, rgba(0,80,255,.07), transparent 30%),
        var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      width: 230px;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      padding: 28px 20px;
      border-right: 1px solid var(--border);
      background: rgba(5,9,16,.92);
      backdrop-filter: blur(15px);
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 18px;
      margin-bottom: 45px;
    }

    .logo-mark {
      color: var(--blue);
      font-size: 27px;
      font-style: italic;
    }

    .nav a {
      display: block;
      padding: 12px 14px;
      margin: 5px 0;
      border-radius: 10px;
      color: var(--muted);
      transition: .25s;
    }

    .nav a:hover {
      color: white;
      background: rgba(22,131,255,.14);
    }

    .socials {
      position: absolute;
      bottom: 30px;
      display: flex;
      gap: 13px;
      color: var(--muted);
    }

    .socials a:hover {
      color: var(--blue);
    }

    /* MAIN */
    main {
      width: 100%;
      margin-left: 230px;
      padding: 35px 55px;
      max-width: 1450px;
    }

    section {
      padding: 80px 0;
      border-bottom: 1px solid var(--border);
    }

    /* HERO */
    .hero {
      min-height: 88vh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 50px;
    }

    .hero-text {
      max-width: 650px;
    }

    .hello {
      display: inline-block;
      border: 1px solid rgba(22,131,255,.5);
      color: #58a8ff;
      padding: 7px 15px;
      border-radius: 30px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(55px, 8vw, 100px);
      line-height: .95;
      letter-spacing: -4px;
      margin-bottom: 20px;
    }

    h1 span,
    .blue {
      color: var(--blue);
    }

    .hero h2 {
      font-size: 25px;
      margin-bottom: 14px;
    }

    .hero p {
      color: var(--muted);
      max-width: 580px;
      font-size: 17px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 21px;
      border-radius: 30px;
      border: 1px solid rgba(22,131,255,.7);
      color: white;
      transition: .25s;
    }

    .btn.primary {
      background: linear-gradient(135deg, #1683ff, #0058db);
      box-shadow: 0 8px 30px rgba(0,100,255,.25);
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .hero-art {
      width: 400px;
      height: 430px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .circle {
      position: absolute;
      width: 330px;
      height: 330px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(0,115,255,.35), rgba(0,30,100,.08));
      box-shadow: 0 0 100px rgba(0,100,255,.22);
    }

    .avatar {
      width: 250px;
      height: 310px;
      border-radius: 35px;
      border: 1px solid rgba(255,255,255,.12);
      background:
        linear-gradient(145deg, #142b4d, #07101e);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      font-size: 80px;
      font-weight: 900;
      color: white;
      box-shadow: 0 30px 70px rgba(0,0,0,.45);
    }

    .brush {
      position: absolute;
      width: 300px;
      height: 80px;
      background: var(--blue);
      transform: rotate(-17deg);
      opacity: .8;
      filter: blur(.3px);
      border-radius: 50%;
      z-index: 1;
    }

    /* HEADINGS */
    .section-label {
      color: #58a8ff;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    h3 {
      font-size: 42px;
      line-height: 1.1;
      margin-bottom: 25px;
    }

    /* ABOUT */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
    }

    .about-text p {
      color: var(--muted);
      margin-bottom: 20px;
    }

    .info {
      margin-top: 20px;
      color: var(--mut
